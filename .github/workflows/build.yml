name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Gradle Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 9.4.0
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.4.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.4.0/bin" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Copy JAR to Output
        run: |
          mkdir -p output
          cp build/libs/CommandHelper-1.0-SNAPSHOT-all.jar output/CommandHelper.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: CommandHelper
          path: output/CommandHelper.jar
          if-no-files-found: error
          retention-days: 14
